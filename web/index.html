    .ye-progress {
      width: 160px;
      height: 3px;
      margin-top: 26px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 2px;
      overflow: hidden;
      position: relative;
    }
    .ye-progress::after {
      content: '';
      position: absolute;
      inset: 0;
      width: 40%;
      background: linear-gradient(90deg, transparent, #D9B48F, transparent);
      animation: ye-slide 1.4s ease-in-out infinite;

  <script>
    function hideSplash() {
      var s = document.getElementById('ye-splash');
      if (!s || s.classList.contains('fade-out')) return;
      s.classList.add('fade-out');
      setTimeout(function () { s.remove(); }, 700);
    }
    window.addEventListener('flutter-first-frame', hideSplash);
    setTimeout(hideSplash, 8000);
  </script>
</body>
